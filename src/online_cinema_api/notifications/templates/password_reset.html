<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Скидання пароля</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
  <style>
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
    }
    .reset-card { max-width: 440px; width: 100%; border: 0; border-radius: 1rem; }
  </style>
</head>
<body class="d-flex align-items-center justify-content-center p-3">
  <div class="card reset-card shadow-lg">
    <div class="card-body p-4 p-md-5">
      <div class="text-center mb-4">
        <h3 class="fw-bold mb-1">Online Cinema</h3>
        <p class="text-muted mb-0">Створіть новий пароль</p>
      </div>

      <p class="small text-muted text-center">
        Акаунт: <strong id="email-label"></strong>
      </p>

      <div id="alert" class="alert d-none" role="alert"></div>

      <form id="reset-form" novalidate>
        <div class="mb-3">
          <label for="password" class="form-label">Новий пароль</label>
          <div class="input-group">
            <input type="password" class="form-control" id="password"
                   autocomplete="new-password" required>
            <button class="btn btn-outline-secondary" type="button" id="toggle">
              Показати
            </button>
          </div>
        </div>

        <div class="mb-4">
          <label for="confirm" class="form-label">Повторіть пароль</label>
          <input type="password" class="form-control" id="confirm"
                 autocomplete="new-password" required>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2" id="submit">
          <span class="spinner-border spinner-border-sm d-none" id="spinner"></span>
          <span id="submit-text">Змінити пароль</span>
        </button>
      </form>

      <div class="text-center mt-4 d-none" id="login-block">
        <a href="/docs" class="btn btn-success w-100">Перейти до входу</a>
      </div>
    </div>
  </div>

  <script>
    const email = {{ email | tojson }};
    const token = {{ token | tojson }};

    const form = document.getElementById("reset-form");
    const alertBox = document.getElementById("alert");
    const passwordInput = document.getElementById("password");
    const confirmInput = document.getElementById("confirm");
    const submitBtn = document.getElementById("submit");
    const spinner = document.getElementById("spinner");
    const submitText = document.getElementById("submit-text");

    document.getElementById("email-label").textContent = email;

    document.getElementById("toggle").addEventListener("click", (e) => {
      const show = passwordInput.type === "password";
      passwordInput.type = show ? "text" : "password";
      confirmInput.type = show ? "text" : "password";
      e.target.textContent = show ? "Сховати" : "Показати";
    });

    function showAlert(type, text) {
      alertBox.className = "alert alert-" + type;
      alertBox.textContent = text;
    }

    function formatError(detail) {
      if (Array.isArray(detail)) {
        return detail.map((d) => d.msg || JSON.stringify(d)).join("; ");
      }
      return typeof detail === "string" ? detail : JSON.stringify(detail);
    }

    function setLoading(loading) {
      submitBtn.disabled = loading;
      spinner.classList.toggle("d-none", !loading);
      submitText.textContent = loading ? "Зачекайте..." : "Змінити пароль";
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      if (passwordInput.value !== confirmInput.value) {
        showAlert("warning", "Паролі не збігаються.");
        return;
      }

      setLoading(true);
      try {
        const response = await fetch(window.location.pathname, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            email: email,
            token: token,
            password: passwordInput.value,
          }),
        });
        const data = await response.json();

        if (response.ok) {
          showAlert("success", data.message || "Пароль успішно змінено.");
          form.classList.add("d-none");
          document.getElementById("login-block").classList.remove("d-none");
        } else {
          showAlert("danger", formatError(data.detail));
          setLoading(false);
        }
      } catch (err) {
        showAlert("danger", "Помилка мережі. Спробуйте ще раз.");
        setLoading(false);
      }
    });
  </script>
</body>
</html>
