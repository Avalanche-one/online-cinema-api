[project]
name = "online-cinema-api"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "aiosmtplib>=5.1.3",
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "celery>=5.7.0",
    "email-validator>=2.3.0",
    "fastapi>=0.162.4",
    "jinja2>=3.1.6",
    "passlib>=1.7.4",
    "pydantic-settings>=2.16.2",
    "python-jose>=3.5.0",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff.lint]
ignore = [
    "B008", # ignore FastAPI Depends in function argument defaults
]
